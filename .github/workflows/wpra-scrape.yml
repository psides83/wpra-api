name: WPRA Scrape

on:
  schedule:
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch:
    inputs:
      refresh_years:
        description: "Comma-separated years to force refresh (example: 2025)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Test scraper season safeguards
        run: node --test wpra_scraper.test.cjs

      - name: Run scraper
        env:
          WPRA_REFRESH_YEARS: ${{ github.event.inputs.refresh_years || '' }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node wpra_scraper.cjs
