name: WPRA Scrape

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout data repo
        uses: actions/checkout@v6
        with:
          repository: psides83/wpra-json
          token: ${{ secrets.WPRA_JSON_REPO_TOKEN }}
          path: wpra-json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          WPRA_OUTPUT_DIR: ${{ github.workspace }}/wpra-json
        run: node wpra_scraper.cjs

      - name: Commit and push data changes
        working-directory: ${{ github.workspace }}/wpra-json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh WPRA standings"
          git push origin HEAD:main
